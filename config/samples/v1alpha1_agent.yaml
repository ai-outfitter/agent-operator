apiVersion: aioutfitter.com/v1alpha1
kind: Agent
metadata:
  name: researcher
spec:
  # Optional. When omitted, the operator's configured default image is used.
  # Users can select the published Outfitter image or their own derivative.
  image: ghcr.io/ai-outfitter/outfitter:1.0.2
  # A list preserves the many-to-many future; the MVP exercises one entry.
  memberships:
    - organization: example-org
      # An empty list grants organization-level work, not every project.
      projects: []
  profile:
    # This slug must resolve from example-org's pinned catalog.
    agent: researcher
    harness: pi
  credentials:
    # Referenced by name only, in namespace agent-researcher. The controller
    # creates the namespace and exposes these, but never inspects their contents.
    # Key-level contracts (e.g. the email adapter's JMAP keys) belong to the
    # composed agent, not the operator.
    - secret: researcher-email
      as: env
    - secret: researcher-model
      as: env
    - secret: researcher-ssh
      as: volume
    # Non-secret runtime config (e.g. channel default-org routing) via ConfigMap.
    - configMap: researcher-runtime
      as: env
  workspace:
    # The entire namespace is this agent's workspace and autonomy boundary.
    resourceQuota:
      hard:
        requests.cpu: "4"
        requests.memory: 8Gi
        limits.cpu: "8"
        limits.memory: 16Gi
        requests.storage: 50Gi
        persistentvolumeclaims: "8"
        count/pods: "20"
        count/jobs.batch: "50"
        count/services: "10"
        count/configmaps: "50"
        count/secrets: "20"
    limitRange:
      container:
        defaultRequest:
          cpu: 100m
          memory: 128Mi
        default:
          cpu: "1"
          memory: 1Gi
