apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: voice-preview
spec:
  secretName: voice-preview-tls
  dnsNames: [voice-preview.unsupervised.wtf]
  issuerRef:
    name: letsencrypt-cloudflare-dns
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-preview
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20k
spec:
  ingressClassName: nginx
  tls:
    - hosts: [voice-preview.unsupervised.wtf]
      secretName: voice-preview-tls
  rules:
    - host: voice-preview.unsupervised.wtf
      http:
        paths:
          - path: /residents
            pathType: Exact
            backend:
              service:
                name: voice-broker
                port:
                  name: http
          - path: /sessions
            pathType: Exact
            backend:
              service:
                name: voice-broker
                port:
                  name: http
          - path: /end
            pathType: Exact
            backend:
              service:
                name: voice-broker
                port:
                  name: http
