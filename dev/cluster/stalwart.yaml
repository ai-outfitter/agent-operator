apiVersion: v1
kind: Namespace
metadata:
  name: link-system
  labels:
    app.kubernetes.io/part-of: link-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: link-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: link-operator
data:
  config.json: |
    {
      "@type": "RocksDb",
      "path": "/var/lib/stalwart"
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: stalwart-bootstrap
  namespace: link-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: link-operator
type: Opaque
stringData:
  STALWART_RECOVERY_ADMIN: admin:link-dev-admin
  STALWART_USER: admin
  STALWART_PASSWORD: link-dev-admin
  plan.ndjson: |
    {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"jmap":{"name":"jmap","bind":{"[::]:8081":true},"protocol":"http","useTls":false}}}
    {"@type":"upsert","object":"Domain","matchOn":["name"],"value":{"link-domain":{"name":"link.test","description":"Link Operator development mail"}}}
    {"@type":"upsert","object":"Account","matchOn":["name","domainId"],"value":{"researcher":{"@type":"User","name":"researcher","domainId":"#link-domain","description":"M1 researcher agent","credentials":{"0":{"@type":"Password","secret":"researcher-dev-password-2026!"}}},"demo-user":{"@type":"User","name":"demo-user","domainId":"#link-domain","description":"M1 demo sender","credentials":{"0":{"@type":"Password","secret":"demo-user-dev-password-2026!"}}}}}
    {"@type":"update","object":"SystemSettings","value":{"defaultDomainId":"#link-domain","defaultHostname":"mail.link.test"}}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-headless
  namespace: link-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: link-operator
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: jmap
      port: 8080
      targetPort: jmap
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: link-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: link-operator
spec:
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: jmap
      port: 8080
      targetPort: jmap
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-bootstrap
  namespace: link-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: link-operator
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: bootstrap
      port: 8080
      targetPort: bootstrap
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: link-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: link-operator
spec:
  serviceName: stalwart-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
        app.kubernetes.io/part-of: link-operator
    spec:
      securityContext:
        fsGroup: 2000
        runAsUser: 2000
        runAsGroup: 2000
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart@sha256:25001929f36a62521cedc50f12527080dac4cf6a0cc31b617b669d921cafc36a
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/stalwart/config.json
          env:
            - name: STALWART_PUBLIC_URL
              value: http://stalwart.link-system.svc.cluster.local:8080
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-bootstrap
                  key: STALWART_RECOVERY_ADMIN
          ports:
            - name: jmap
              containerPort: 8081
              hostPort: 8081
            - name: bootstrap
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: jmap
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: jmap
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
      volumes:
        - name: config
          configMap:
            name: stalwart-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: stalwart
          app.kubernetes.io/part-of: link-operator
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart-no-internet-egress
  namespace: link-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: link-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
