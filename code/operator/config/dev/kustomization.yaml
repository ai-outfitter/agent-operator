apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
images:
  - name: controller
    newName: localhost/agent-operator
    newTag: dev
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    # --inference-relay-image comes from config/manager/manager.yaml (the webapp
    # image, promoted together with the webapp gateway image); override it here
    # only to run a different relay build.
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --agent-image=localhost/agent-runtime:dev
