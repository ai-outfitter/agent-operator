{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
  name: workspaces.aioutfitter.com
spec:
  group: aioutfitter.com
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: State
      type: string
    - jsonPath: .spec.storagePolicy
      name: Policy
      type: string
    - jsonPath: .status.computeGeneration
      name: Generation
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace is a temporary environment. It has no resident identity
          or Kubernetes API authority.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EphemeralWorkspaceSpec is independent of resident Agent identity
              and catalogs.
            properties:
              awakeUntil:
                description: AwakeUntil is renewed by the trusted gateway while a
                  bounded run is active.
                format: date-time
                type: string
              computeGeneration:
                description: |-
                  ComputeGeneration selects the current runtime Pod. The gateway sets 1 at creation and increments
                  it for every normal wake from Sleeping; active-run renewals leave it unchanged.
                format: int64
                minimum: 1
                type: integer
              credentialSecretName:
                description: CredentialSecretName identifies the workspace-scoped
                  token; never an upstream credential.
                pattern: ^ws-[a-z0-9-]+$
                type: string
              expiresAt:
                description: ExpiresAt is renewed only by user activity. Expiry removes
                  this workspace, not its namespace.
                format: date-time
                type: string
              image:
                description: |-
                  Image is a digest-pinned runtime reference chosen by trusted operator configuration. When unset
                  the controller default applies. Either is captured when a generation's Pod is created and never
                  changes an existing Pod.
                pattern: ^[^@\s]+@sha256:[a-f0-9]{64}$
                type: string
              storageClassName:
                type: string
              storagePolicy:
                default: reusable
                description: |-
                  StoragePolicy is reusable (idle sleep plus user-renewed expiry) or task (one submitted run,
                  retained for a fixed period after it finishes). The gateway enforces the task limits.
                enum:
                - reusable
                - task
                type: string
              storageSize:
                default: 5Gi
                pattern: ^[1-9][0-9]*(Mi|Gi)$
                type: string
            required:
            - awakeUntil
            - computeGeneration
            - credentialSecretName
            - expiresAt
            type: object
            x-kubernetes-validations:
            - message: awakeUntil must not exceed expiresAt
              rule: self.awakeUntil <= self.expiresAt
            - message: computeGeneration cannot decrease
              rule: self.computeGeneration >= oldSelf.computeGeneration
            - message: storagePolicy is immutable
              rule: '!has(oldSelf.storagePolicy) || self.storagePolicy == oldSelf.storagePolicy'
          status:
            properties:
              computeGeneration:
                description: ComputeGeneration is the last generation for which the
                  controller attempted a runtime Pod.
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              podName:
                description: PodName is the runtime Pod of the current generation;
                  cleared before the controller stops it.
                type: string
              resolvedImage:
                description: ResolvedImage is the exact reference the current or last
                  runtime Pod was created with.
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
