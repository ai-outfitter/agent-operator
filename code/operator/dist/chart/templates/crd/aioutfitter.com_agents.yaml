{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agents.aioutfitter.com
spec:
  group: aioutfitter.com
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is the Schema for the agents API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of Agent.
            properties:
              browser:
                description: Browser adds a headless-Chrome DevTools sidecar to the
                  agent Pod.
                properties:
                  enabled:
                    type: boolean
                  image:
                    description: |-
                      Image must place its Chromium binary at /headless-shell/headless-shell
                      and accept Chrome flags as arguments (the operator passes
                      --remote-debugging-address/-port, --no-sandbox, --disable-gpu,
                      --disable-dev-shm-usage, --user-data-dir). The operator always runs
                      that path directly rather than the image entrypoint, deliberately and
                      without an override: the upstream headless-shell entrypoint starts a
                      forwarder that publishes the DevTools listener on 0.0.0.0, and CDP is
                      unauthenticated full browser control, so an entrypoint must never
                      choose the listener address. Images with another layout are not
                      supported. When omitted, the operator's digest-pinned default browser
                      image is used.
                    minLength: 1
                    type: string
                  resources:
                    description: |-
                      Resources for the sidecar container. When omitted, the workspace
                      LimitRange defaults apply. The sidecar counts against the agent
                      namespace's ResourceQuota.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              catalogSync:
                description: |-
                  CatalogSync asks the operator to synchronize the resolved Organization
                  catalog before user setup steps and the resident runtime start. The sync
                  init container receives the Agent's generic credential projections, but
                  it does not receive the Kubernetes API token.
                properties:
                  enabled:
                    description: |-
                      Enabled adds a dedicated init container that runs outfitter sync with the
                      Agent's settings, workspace, and credential projections.
                    type: boolean
                required:
                - enabled
                type: object
              channels:
                description: |-
                  Channels explicitly selects the resident runtime's channel sources. When
                  omitted, the runtime retains its own source-discovery behavior.
                items:
                  minLength: 1
                  pattern: ^[a-z][a-z0-9_-]*$
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              credentials:
                items:
                  description: |-
                    CredentialReference identifies one object by name only. The operator checks
                    existence and, for env exposure, reserved runtime-configuration migration
                    key names; it does not validate values or other key-level contracts.
                  properties:
                    as:
                      description: CredentialExposure controls how a referenced object
                        reaches the runtime.
                      enum:
                      - env
                      - volume
                      type: string
                    configMap:
                      minLength: 1
                      type: string
                    secret:
                      minLength: 1
                      type: string
                  required:
                  - as
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of secret or configMap must be set
                    rule: has(self.secret) != has(self.configMap)
                type: array
                x-kubernetes-list-type: atomic
              forge:
                description: Forge declares this resident's identity on its Organization
                  forge.
                properties:
                  username:
                    maxLength: 255
                    minLength: 1
                    pattern: ^[A-Za-z0-9_.-]+$
                    type: string
                required:
                - username
                type: object
              github:
                description: GitHub configures notification routing and cadence for
                  resident agents.
                properties:
                  filters:
                    items:
                      minLength: 1
                      pattern: ^[a-z_]+$
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  notifyOrgs:
                    items:
                      minLength: 1
                      pattern: ^[A-Za-z0-9_.-]+$
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  pollMs:
                    format: int64
                    maximum: 86400000
                    minimum: 1000
                    type: integer
                type: object
              image:
                description: |-
                  Image selects the user-owned runtime image. When omitted, the operator's
                  configured default image is used.
                minLength: 1
                type: string
              memberships:
                description: M1 exercises one membership while retaining the eventual
                  list shape.
                items:
                  description: Membership grants organization-level access and optionally
                    names projects.
                  properties:
                    organization:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    projects:
                      description: An empty list means organization-level access,
                        not every project.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - organization
                  type: object
                maxItems: 1
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - organization
                x-kubernetes-list-type: map
              profile:
                description: AgentProfile selects the slug and harness that Outfitter
                  resolves at runtime.
                properties:
                  agent:
                    minLength: 1
                    type: string
                  harness:
                    default: pi
                    enum:
                    - pi
                    type: string
                required:
                - agent
                type: object
              setup:
                description: |-
                  Setup steps run as ordered init containers before the agent starts, with
                  the agent's credentials and workspace mounted. Use them for usecase
                  bootstrap (e.g. provisioning a mailbox, waiting for a dependency).
                items:
                  description: SetupStep defines one initialization script that runs
                    before the agent.
                  properties:
                    name:
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    script:
                      minLength: 1
                      type: string
                  required:
                  - name
                  - script
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              workspace:
                description: WorkspaceSpec configures the bounded agent namespace
                  workspace.
                properties:
                  limitRange:
                    description: WorkspaceLimitRangeSpec defines one container LimitRange
                      item.
                    properties:
                      container:
                        description: ContainerLimitSpec contains default requests
                          and limits for workspace Pods.
                        properties:
                          default:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: ResourceList is a set of (resource name,
                              quantity) pairs.
                            type: object
                          defaultRequest:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: ResourceList is a set of (resource name,
                              quantity) pairs.
                            type: object
                        required:
                        - default
                        - defaultRequest
                        type: object
                        x-kubernetes-validations:
                        - message: defaultRequest must include cpu and memory
                          rule: self.defaultRequest.size() >= 2
                        - message: default must include cpu and memory
                          rule: self.default.size() >= 2
                    required:
                    - container
                    type: object
                  resourceQuota:
                    description: ResourceQuotaSpec contains the aggregate namespace
                      hard limits.
                    properties:
                      hard:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: ResourceList is a set of (resource name, quantity)
                          pairs.
                        type: object
                    required:
                    - hard
                    type: object
                    x-kubernetes-validations:
                    - message: resourceQuota.hard must not be empty
                      rule: self.hard.size() > 0
                  volume:
                    description: WorkspaceVolumeSpec configures the durable per-agent
                      cache volume.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 10Gi
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        type: string
                    type: object
                required:
                - limitRange
                - resourceQuota
                type: object
            required:
            - memberships
            - profile
            - workspace
            type: object
          status:
            description: AgentStatus defines the observed state of Agent.
            properties:
              catalogSources:
                items:
                  description: CatalogSourceStatus identifies a delegated source without
                    copying its URI.
                  properties:
                    name:
                      type: string
                    revision:
                      type: string
                  required:
                  - name
                  - revision
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespace:
                type: string
              observedGeneration:
                format: int64
                type: integer
              outfitterRevision:
                type: string
              quotaHard:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: ResourceList is a set of (resource name, quantity) pairs.
                type: object
              quotaUsed:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: ResourceList is a set of (resource name, quantity) pairs.
                type: object
              resolvedImageDigest:
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
        x-kubernetes-validations:
        - message: agent name must be no longer than 57 characters
          rule: self.metadata.name.size() <= 57
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
