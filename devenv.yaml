inputs:
  nixpkgs:
    # Use the full nixpkgs source. devenv-nixpkgs/rolling filters non-Nix
    # files and can omit patches referenced by package expressions.
    url: github:NixOS/nixpkgs/nixos-unstable
  nixos:
    url: github:NixOS/nixpkgs/nixos-unstable
  microvm:
    url: github:microvm-nix/microvm.nix
    inputs:
      nixpkgs:
        follows: nixos
  outfitter:
    url: github:ai-outfitter/outfitter/main
    inputs:
      nixpkgs:
        follows: nixos
  nix2container:
    url: github:nlewo/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
